[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "eightbit-studio-plugin-mml"
version = "1.0.0"
description = "Mml - a exporter plugin for 8Bit Music Code Studio"
requires-python = ">=3.10"
dependencies = ["numpy"]

[project.entry-points."eightbit_studio.plugins"]
mml = "bms_mml:register"

[tool.setuptools]
packages = ["bms_mml"]
# NOTE: '8bms plugin build' also copies plugin.toml into the package.
