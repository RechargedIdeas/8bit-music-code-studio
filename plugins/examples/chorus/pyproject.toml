[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "eightbit-studio-plugin-chorus"
version = "1.0.0"
description = "Chorus - a effect plugin for 8Bit Music Code Studio"
requires-python = ">=3.10"
dependencies = ["numpy"]

[project.entry-points."eightbit_studio.plugins"]
chorus = "bms_chorus:register"

[tool.setuptools]
packages = ["bms_chorus"]
# NOTE: '8bms plugin build' also copies plugin.toml into the package.
